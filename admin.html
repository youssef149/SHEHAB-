<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>يوسف شهاب | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Cairo,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 10% 10%,#7c3aed33,transparent 28%),radial-gradient(circle at 90% 30%,#2563eb22,transparent 30%),#050507}.wrap{max-width:1100px;margin:auto;padding:25px 16px 50px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:28px}.title p{margin:3px 0;color:#999;font-size:12px}.btn{border:1px solid #ffffff1f;background:#ffffff0d;color:#fff;padding:10px 15px;border-radius:12px;font-family:inherit;cursor:pointer}.btn:hover{background:#ffffff18}.login{max-width:430px;margin:9vh auto;background:#ffffff0b;border:1px solid #ffffff17;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(15px)}.login h1{text-align:center;margin-top:0}.field{margin:13px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff18;background:#0008;color:#fff;font-family:inherit;outline:none}.primary{width:100%;background:linear-gradient(135deg,#7c3aed,#2563eb);border:0}.error{color:#fca5a5;font-size:12px;margin-top:10px}.dashboard{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#ffffff09;border:1px solid #ffffff14;border-radius:18px;padding:18px}.label{color:#999;font-size:11px}.value{font-size:28px;font-weight:900;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.panel{background:#ffffff08;border:1px solid #ffffff14;border-radius:18px;padding:18px;overflow:hidden}.panel h2{font-size:15px;margin:0 0 13px}.bar{height:9px;background:#ffffff0d;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);border-radius:99px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0b;font-size:12px}.row:last-child{border:0}.muted{color:#999}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:right;padding:9px;border-bottom:1px solid #ffffff0d;white-space:nowrap}th{color:#aaa}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#22c55e1c;color:#86efac}.logout{color:#fca5a5;border-color:#ef444433}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.value{font-size:23px}.title h1{font-size:23px}}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>🔐 لوحة الأدمن</h1><p style="text-align:center;color:#999;font-size:12px">يوسف شهاب — إحصائيات الموقع</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
  <button id="loginBtn" class="btn primary">تسجيل الدخول</button><div id="loginError" class="error"></div>
</div>
<div id="dashboard" class="dashboard"><div class="wrap">
  <div class="top"><div class="title"><h1>لوحة تحكم يوسف شهاب</h1><p>Firebase Realtime Analytics • rps-online-785fc</p></div><button id="logout" class="btn logout">تسجيل الخروج</button></div>
  <div class="cards">
    <div class="card"><div class="label">إجمالي الزيارات</div><div id="visits" class="value">0</div></div>
    <div class="card"><div class="label">الجلسات</div><div id="sessions" class="value">0</div></div>
    <div class="card"><div class="label">ضغطات الروابط</div><div id="clicks" class="value">0</div></div>
    <div class="card"><div class="label">زوار مميزون</div><div id="unique" class="value">0</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>🔗 أكثر الروابط ضغطًا</h2><div id="links"></div></div>
    <div class="panel"><h2>📱 الأجهزة</h2><div id="devices"></div></div>
    <div class="panel"><h2>🌐 اللغات ومصدر الزيارة</h2><div id="meta"></div></div>
    <div class="panel"><h2>🕘 آخر النشاطات</h2><div id="recent"></div></div>
  </div>
  <div class="panel" style="margin-top:15px"><h2>📊 سجل النشاط</h2><div class="table-wrap"><table><thead><tr><th>النوع</th><th>الرابط</th><th>الجهاز</th><th>اللغة</th><th>المصدر</th><th>الوقت</th></tr></thead><tbody id="events"></tbody></table></div></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAUV_pAXMCjUVPVNUGnAGkbu9De39nEEU",authDomain:"rps-online-785fc.firebaseapp.com",databaseURL:"https://rps-online-785fc-default-rtdb.firebaseio.com",projectId:"rps-online-785fc",storageBucket:"rps-online-785fc.firebasestorage.app",messagingSenderId:"832559985038",appId:"1:832559985038:web:ebdc8da7c7f4c7a9ef34df",measurementId:"G-76XM3GND1Y"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);let stop=null;
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ar-EG'),time=t=>t?new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'-';
$('loginBtn').onclick=async()=>{ $('loginError').textContent=''; try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginError').textContent='تعذر تسجيل الدخول: '+(e.code||'خطأ غير معروف')}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(user){$('login').style.display='none';$('dashboard').style.display='block';start();}else{$('dashboard').style.display='none';$('login').style.display='block';if(stop)stop();}});
function start(){const r=ref(db,'siteAnalytics/events');stop=onValue(r,snap=>render(snap.val()||{}),err=>{$('recent').innerHTML='<div class="error">لا يمكن قراءة الإحصائيات. راجع Firebase Security Rules.</div>';console.error(err)})}
function render(data){const rows=Object.entries(data).map(([id,x])=>({id,...x})).sort((a,b)=>(b.time||0)-(a.time||0));const visits=rows.filter(x=>x.type==='visit'),sessions=rows.filter(x=>x.type==='session'),clicks=rows.filter(x=>x.type==='click');const uniq=new Set(rows.map(x=>x.visitorId).filter(Boolean));$('visits').textContent=fmt(visits.length);$('sessions').textContent=fmt(sessions.length);$('clicks').textContent=fmt(clicks.length);$('unique').textContent=fmt(uniq.size);\n const count=(arr,key)=>{const m={};arr.forEach(x=>{const k=x[key]||'غير معروف';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};\n const linkCount=count(clicks,'link');const max=linkCount[0]?.[1]||1;$('links').innerHTML=linkCount.slice(0,10).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${Math.max(3,v/max*100)}%"></i></div>`).join('')||'<span class="muted">لا توجد ضغطات بعد</span>';\n const dev=count(rows,'device');$('devices').innerHTML=dev.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<span class="muted">لا توجد بيانات</span>';\n const langs=count(rows,'language').slice(0,5),refs=count(rows,'referrer').slice(0,5);$('meta').innerHTML=[...langs.map(([k,v])=>`<div class="row"><span>🌐 ${esc(k)}</span><b>${fmt(v)}</b></div>`),...refs.map(([k,v])=>`<div class="row"><span>↗️ ${esc(short(k,45))}</span><b>${fmt(v)}</b></div>`)].join('')||'<span class="muted">لا توجد بيانات</span>';\n $('recent').innerHTML=rows.slice(0,8).map(x=>`<div class="row"><span>${typeName(x.type)}</span><span class="muted">${time(x.time)}</span></div>`).join('')||'<span class="muted">لا توجد نشاطات</span>';\n $('events').innerHTML=rows.slice(0,100).map(x=>`<tr><td><span class="status">${typeName(x.type)}</span></td><td>${esc(short(x.link||'-',35))}</td><td>${esc(x.device||'-')}</td><td>${esc(x.language||'-')}</td><td>${esc(short(x.referrer||'-',30))}</td><td>${time(x.time)}</td></tr>`).join('');}
function typeName(t){return t==='visit'?'زيارة':t==='session'?'جلسة':t==='click'?'ضغطة':t||'-'}function short(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
</body></html>
